apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
  labels:
    name: amazon-cloudwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-role
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - pods/log
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: amazon-cloudwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-cluster-info
  namespace: amazon-cloudwatch
data:
  cluster.name: "spare-car-k8s-cluster"
  http.server: "On"
  http.port: "2020"
  logs.region: "us-east-1"
  read.head: "Off"
  read.tail: "On"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: amazon-cloudwatch
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 info
        Daemon                    off
        Parsers_File              parsers.conf
        HTTP_Server               ${HTTP_SERVER}
        HTTP_Listen               0.0.0.0
        HTTP_Port                 ${HTTP_PORT}

    @INCLUDE application-log.conf

  application-log.conf: |
    [INPUT]
        Name                      tail
        Tag                       application.*
        Path                      /var/log/containers/*.log
        Exclude_Path              /var/log/containers/fluent-bit*,/var/log/containers/aws-node*,/var/log/containers/kube-proxy*
        multiline.parser          docker, cri
        DB                        /var/fluent-bit/state/flb_container.db
        Mem_Buf_Limit             50MB
        Skip_Long_Lines           On
        Refresh_Interval          10
        Rotate_Wait               30
        storage.type              filesystem
        Read_from_Head            ${READ_FROM_HEAD}

    [FILTER]
        Name                      kubernetes
        Match                     application.*
        Kube_URL                  https://kubernetes.default.svc:443
        Kube_Tag_Prefix           application.var.log.containers.
        Merge_Log                 On
        Merge_Log_Key             log_processed
        K8S-Logging.Parser        On
        K8S-Logging.Exclude       Off

    [OUTPUT]
        Name                      cloudwatch_logs
        Match                     application.*
        region                    ${AWS_REGION}
        log_group_name            /aws/containerinsights/${CLUSTER_NAME}/application
        log_stream_prefix         ${HOST_NAME}-
        auto_create_group         true

  parsers.conf: |
    [PARSER]
        Name                      docker
        Format                    json
        Time_Key                  time
        Time_Format               %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep                 On

    [PARSER]
        Name                      cri
        Format                    regex
        Regex                     ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key                  time
        Time_Format               %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: amazon-cloudwatch
  labels:
    k8s-app: fluent-bit
spec:
  selector:
    matchLabels:
      k8s-app: fluent-bit
  template:
    metadata:
      labels:
        k8s-app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      terminationGracePeriodSeconds: 30
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: logs.region
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: cluster.name
            - name: HTTP_SERVER
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: http.server
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: http.port
            - name: READ_FROM_HEAD
              valueFrom:
                configMapKeyRef:
                  name: fluent-bit-cluster-info
                  key: read.head
            - name: HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              memory: 200Mi
          volumeMounts:
            - name: fluent-bit-state
              mountPath: /var/fluent-bit/state
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: fluent-bit-state
          hostPath:
            path: /var/fluent-bit/state
            type: DirectoryOrCreate
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
