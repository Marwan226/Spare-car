apiVersion: kubeadm.k8s.io/v1beta3
kind: JoinConfiguration
discovery:
  bootstrapToken:
    apiServerEndpoint: "my-k8s-api-nlb-123456.us-east-1.elb.amazonaws.com:6443"
    token: "REPLACE_WITH_BOOTSTRAP_TOKEN"
    caCertHashes:
      - "sha256:REPLACE_WITH_CA_CERT_HASH"
controlPlane:
  localAPIEndpoint:
    advertiseAddress: "10.0.12.10"
    bindPort: 6443
  certificateKey: "REPLACE_WITH_CERTIFICATE_KEY"
nodeRegistration:
  name: "control-plane-b"
  criSocket: "unix:///run/containerd/containerd.sock"
  taints:
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
