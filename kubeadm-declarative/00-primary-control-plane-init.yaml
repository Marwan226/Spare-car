apiVersion: kubeadm.k8s.io/v1beta3
kind: InitConfiguration
bootstrapTokens:
  - token: "abcdef.0123456789abcdef"
    description: "Bootstrap token for worker and secondary control-plane nodes"
    ttl: "0"
localAPIEndpoint:
  advertiseAddress: "10.0.11.10"
  bindPort: 6443
nodeRegistration:
  name: "control-plane-a"
  criSocket: "unix:///run/containerd/containerd.sock"
  taints:
    - key: "node-role.kubernetes.io/control-plane"
      effect: "NoSchedule"
---
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
kubernetesVersion: "v1.30.8"
clusterName: "graduation-k8s-cluster"
controlPlaneEndpoint: "REPLACE_WITH_NLB_DNS_NAME:6443"
certificatesDir: "/etc/kubernetes/pki"
imageRepository: "registry.k8s.io"
networking:
  dnsDomain: "cluster.local"
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "172.20.0.0/16"
apiServer:
  timeoutForControlPlane: "4m0s"
  certSANs:
    - "REPLACE_WITH_NLB_DNS_NAME"
    - "10.0.11.10"
    - "10.0.12.10"
controllerManager: {}
scheduler: {}
etcd:
  local:
    dataDir: "/var/lib/etcd"
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: "systemd"
clusterDNS:
  - "172.20.0.10"
clusterDomain: "cluster.local"
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
mode: "iptables"
